<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A bed only, viewed from slightly above and in front at a three-quarter angle, on a transparent background. Muted wood-gray frame, a pillow, and a teal-dust duvet with open space where a person would lie. A soft contact shadow sits beneath the frame. No character is shown.</desc>

