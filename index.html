<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>אל תפספס</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="game" lang="he"></div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
        if (local) {
          return;
        }
        var scripts = document.scripts;
        for (var i = 0; i < scripts.length; i += 1) {
          if (scripts[i].src && /assets\/(game|index-)/.test(scripts[i].src)) {
            return;
          }
        }
        var script = document.createElement("script");
        script.type = "module";
        script.src = "./assets/game.js";
        document.body.appendChild(script);
        if (
          !document.querySelector(
            'link[href*="assets/game"], link[href*="assets/index-"]',
          )
        ) {
          var style = document.createElement("link");
          style.rel = "stylesheet";
          style.href = "./assets/game.css";
          document.head.appendChild(style);
        }
      });
    </script>
  </body>
</html>
